name: user-service

on:
  push:
    branches: [main, dev]
    paths: ['user-service/**', '.github/workflows/user-service.yml']
  pull_request:
    paths: ['user-service/**', '.github/workflows/user-service.yml']

concurrency:
  group: user-service-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: user-service

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: user_service_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/user_service_test?schema=public
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/user_service_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: user-service/.nvmrc
          cache: npm
          cache-dependency-path: user-service/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: user-service
          target: runtime
          push: false
          tags: user-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
